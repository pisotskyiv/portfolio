version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Families whose packages pin each other move together at every update
      # type, or a lone major fails npm ci / typecheck (e.g. @ai-sdk/* v4
      # needs ai v7). Listed first: a package joins the first group it matches.
      ai-sdk:
        patterns: ["ai", "@ai-sdk/*"]
      test-tooling:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom"]
      # Everything else: minor and patch as one PR; each major on its own so
      # a breaking upgrade that fails CI doesn't hold back the safe ones.
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

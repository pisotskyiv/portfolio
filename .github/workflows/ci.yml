name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Node 22 bundles npm 10, which mis-resolves the TypeScript 7 npm alias
      # (@typescript/native) and rejects the lockfile. Match the npm that
      # writes the lockfile.
      - run: npm install -g npm@11.12.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
